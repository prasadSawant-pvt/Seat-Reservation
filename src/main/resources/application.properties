spring.application.name=seat-reservation

# Server port (Render sets PORT env var)
server.port=${PORT:8080}
server.address=0.0.0.0

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/seat_reservation?TimeZone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jackson.time-zone=Asia/Kolkata

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# HikariCP connection validation
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.test-on-borrow=true
spring.datasource.hikari.test-while-idle=true
spring.datasource.hikari.keepalive-time=30000